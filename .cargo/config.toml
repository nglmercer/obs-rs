[alias]
# Fast local iteration. Keep the broad commands explicit so a developer does
# not accidentally compile the production GStreamer feature while iterating.
dev = "build --workspace --profile dev-fast"
check-fast = "check --workspace --profile dev-fast"
check-all-fast = "check --workspace --all-targets --profile dev-fast"
test-fast = "test --workspace --profile dev-fast"
test-all-fast = "test --workspace --all-targets --profile dev-fast"
clippy-fast = "clippy --workspace --profile dev-fast -- -D warnings"
clippy-all-fast = "clippy --workspace --all-targets --profile dev-fast -- -D warnings"

# The GUI is the slowest and most frequently changed package in this repo.
# Use its bounded-memory profile so Slint/WGPU tests do not make the linker
# hold the whole workspace's debug information in memory.
gui = "build -p obs-rs-gui --profile dev-fast-gui"
gui-check = "check -p obs-rs-gui --all-targets --profile dev-fast-gui"
gui-test = "test -p obs-rs-gui --bin obs-rs-gui --profile dev-fast-gui"
gui-run = "run -p obs-rs-gui --profile dev-fast-gui"
gui-smoke = "run -p obs-rs-gui --profile dev-fast-gui -- --smoke"

# Focused Windows iteration. These commands still compile the required path
# dependencies, but avoid pulling unrelated workspace binaries into the edit
# loop. The target-specific check is useful on a non-Windows host as well.
app = "build -p obs-rs-app --bin obs-rs --profile dev-fast"
app-check = "check -p obs-rs-app --bin obs-rs --profile dev-fast"
windows-check = "build -p obs-rs-app --bin obs-rs-windows-check --profile dev-fast"
windows-check-check = "check -p obs-rs-app --bin obs-rs-windows-check --profile dev-fast"
windows-check-target = "check --target x86_64-pc-windows-msvc -p obs-rs-app --bin obs-rs-windows-check --profile dev-fast"

# The capture helper is intentionally outside the root workspace. Keep its
# common build/test/cleanup operations discoverable and profile-scoped too.
helper = "build --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast"
helper-check = "check --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast"
helper-test = "test --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast"
helper-gui = "build --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast-gui"

# Scope cleanup to the profile that is usually consuming space. The explicit
# workspace alias is useful when a toolchain/profile change invalidates every
# root artifact; the separately maintained Windows helper target is documented
# below because it has its own Cargo manifest and target directory.
clean-fast = "clean --profile dev-fast"
clean-gui-fast = "clean --profile dev-fast-gui"
clean-release = "clean --release"
clean-workspace = "clean --workspace"
clean-helper-fast = "clean --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast"
clean-helper-gui = "clean --manifest-path packaging/windows/capture-helper/Cargo.toml --profile dev-fast-gui"
clean-helper-release = "clean --manifest-path packaging/windows/capture-helper/Cargo.toml --release"
