name: Windows production acceptance

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Hardware capture soak duration in seconds
        default: "1800"
        required: true
        type: string
      require_camera:
        description: Require a connected Media Foundation camera
        default: false
        required: true
        type: boolean

permissions:
  contents: read

# This lane is intentionally separate from the ordinary Windows job. The
# normal job must remain runnable without a native media SDK; this job is the
# release gate for a production Windows package and therefore needs a prepared
# interactive runner with GStreamer installed.
jobs:
  production:
    runs-on: [self-hosted, windows, x64, obs-rs-production]
    timeout-minutes: 510
    env:
      # Set the secret on the repository/environment to exercise a real
      # RTMP/RTMPS/SRT/RIST/WHIP destination. It is deliberately optional so
      # the recording gate can run without publishing credentials.
      OBS_RS_PRODUCTION_STREAM_URL: ${{ secrets.OBS_RS_PRODUCTION_STREAM_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate production runner prerequisites
        shell: pwsh
        run: |
          $runtime = $env:GSTREAMER_1_0_ROOT
          $development = $env:GSTREAMER_1_0_DEVEL_ROOT
          if ([string]::IsNullOrWhiteSpace($runtime)) {
            throw "GSTREAMER_1_0_ROOT must point to the installed 64-bit MSVC GStreamer runtime"
          }
          if ([string]::IsNullOrWhiteSpace($development)) {
            throw "GSTREAMER_1_0_DEVEL_ROOT must point to the matching 64-bit MSVC GStreamer development package"
          }
          foreach ($path in @(
            (Join-Path $runtime "bin"),
            (Join-Path $runtime "lib\gstreamer-1.0"),
            (Join-Path $runtime "libexec\gstreamer-1.0"),
            (Join-Path $development "include\gstreamer-1.0"),
            (Join-Path $development "lib\pkgconfig")
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "production runner prerequisite directory is missing: $path"
            }
          }
          $runtimeProbe = Join-Path $runtime "bin\gst-inspect-1.0.exe"
          $runtimeCore = Join-Path $runtime "bin\gstreamer-1.0-0.dll"
          $scanner = Join-Path $runtime "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          foreach ($path in @($runtimeProbe, $runtimeCore, $scanner)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "production runner prerequisite file is missing: $path"
            }
          }
          $env:PATH = "$(Join-Path $runtime 'bin');$env:PATH"
          $env:PKG_CONFIG_PATH = "$(Join-Path $development 'lib\pkgconfig');$(Join-Path $runtime 'lib\pkgconfig');$env:PKG_CONFIG_PATH"
          "$(Join-Path $runtime 'bin')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_DEVEL_ROOT=$development" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GST_PLUGIN_PATH=$(Join-Path $runtime 'lib\gstreamer-1.0')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GST_PLUGIN_PATH_1_0=$(Join-Path $runtime 'lib\gstreamer-1.0')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GST_PLUGIN_SCANNER=$(Join-Path $runtime 'libexec\gstreamer-1.0\gst-plugin-scanner.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (& $runtimeProbe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "bundled GStreamer probe could not start: $runtimeProbe"
          }
          Write-Output $version
          $version | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "gstreamer-version.txt") -Encoding utf8

      - name: Check and test the native output feature
        shell: pwsh
        run: |
          cargo check --locked -p obs-rs-engine --all-targets --features production-gstreamer
          if ($LASTEXITCODE -ne 0) { throw "native output feature check failed" }
          cargo test --locked -p obs-rs-engine --features production-gstreamer
          if ($LASTEXITCODE -ne 0) { throw "native output feature tests failed" }

      - name: Build and verify the production Windows package
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "obs-rs-windows-production-dist"
          .\packaging\windows\package.ps1 `
            -Configuration release `
            -OutputDirectory $dist `
            -ProductionGStreamer `
            -GStreamerRuntimeDirectory $env:GSTREAMER_1_0_ROOT
          if ($LASTEXITCODE -ne 0) { throw "production Windows package failed" }
          $archive = Get-ChildItem -LiteralPath $dist -Filter "obs-rs-windows-*-x86_64.zip" -File |
            Select-Object -First 1
          if ($null -eq $archive) { throw "production Windows archive was not created" }
          $expanded = Join-Path $env:RUNNER_TEMP "obs-rs-windows-production-expanded"
          if (Test-Path -LiteralPath $expanded) {
            Remove-Item -LiteralPath $expanded -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $packageRoot = Get-ChildItem -LiteralPath $expanded -Directory -Filter "obs-rs" |
            Select-Object -First 1
          if ($null -eq $packageRoot) { throw "expanded production archive has no obs-rs directory" }
          & (Join-Path $packageRoot.FullName "verify-package.ps1") `
            -PackageDirectory $packageRoot.FullName
          if ($LASTEXITCODE -ne 0) { throw "production package verification failed" }
          "ARCHIVE=$($archive.FullName)" | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "production-package.txt") -Encoding utf8
          "PACKAGE_ROOT=$($packageRoot.FullName)" | Add-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "production-package.txt") -Encoding utf8

      - name: Run real Windows capture and production output acceptance
        shell: pwsh
        env:
          OBS_RS_HARDWARE_SOAK_SECONDS: ${{ inputs.duration_seconds }}
          OBS_RS_REQUIRE_PRODUCTION_STREAMING: ${{ vars.OBS_RS_REQUIRE_PRODUCTION_STREAMING || '0' }}
        run: |
          $packageInfo = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "production-package.txt")
          $packageRoot = ($packageInfo | Where-Object { $_ -like "PACKAGE_ROOT=*" } | Select-Object -First 1).Substring(13)
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "windows-production-artifacts"
          $arguments = @(
            "-PackageDirectory", $packageRoot,
            "-OutputDirectory", $artifacts,
            "-SoakSeconds", ([int]$env:OBS_RS_HARDWARE_SOAK_SECONDS),
            "-RequireProduction"
          )
          if ([bool]::Parse("${{ inputs.require_camera }}")) {
            $arguments += "-RequireCamera"
          }
          if ([string]::IsNullOrWhiteSpace($env:OBS_RS_PRODUCTION_STREAM_URL) -and
              $env:OBS_RS_REQUIRE_PRODUCTION_STREAMING -in @("1", "true", "yes", "on")) {
            throw "OBS_RS_REQUIRE_PRODUCTION_STREAMING is enabled but OBS_RS_PRODUCTION_STREAM_URL is not configured"
          }
          & (Join-Path $packageRoot "acceptance.ps1") @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows production acceptance failed" }

      - name: Upload production acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-rs-windows-production
          path: |
            windows-production-artifacts
            gstreamer-version.txt
            production-package.txt
          if-no-files-found: warn
