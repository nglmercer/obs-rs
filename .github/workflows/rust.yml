name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Audit native-language and unsafe boundaries
        shell: bash
        run: |
          set -euo pipefail
          if rg --files --hidden -g '!.git/**' -g '!target/**' \
            | awk -F. 'NF > 1 && $NF ~ /^(c|h|cc|cpp|cxx|hh|hpp|m|mm|cmake)$/' \
            | grep -q .; then
            echo "native source files are not allowed"
            exit 1
          fi
          if rg -n --hidden --glob '!.git/**' --glob '!target/**' --glob '!.github/**' \
            --glob '!Cargo.lock' --glob '!*.md' \
            '(extern "|no_mangle|repr\(C\)|cbindgen|bindgen|build\.rs|cc -|foreign-function)' .; then
            echo "native or FFI markers are not allowed"
            exit 1
          fi
          if rg -n --hidden --glob '!.git/**' --glob '!target/**' --glob '!.github/**' --glob '*.rs' '\bunsafe\b' crates; then
            echo "unsafe Rust is not allowed in the workspace"
            exit 1
          fi

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build release artifacts
        run: cargo build --workspace --release

      - name: Run the end-to-end demo
        run: cargo run -p obs-rs-app --release

      - name: Run the accessible terminal frontend smoke test
        shell: bash
        run: |
          set -euo pipefail
          printf 'program program\nrecord start\ntransition fade 500\nquit\n' \
            | cargo run -p obs-rs-app --bin obs-rs-console --release

      - name: Run the accessible browser frontend smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p obs-rs-app --bin obs-rs-web --release -- --once --bind 127.0.0.1:18765 \
            > web-frontend.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 50); do
            if curl --silent --show-error --fail http://127.0.0.1:18765/ \
              | grep -q 'OBS-RS control room'; then
              break
            fi
            if [ "$attempt" -eq 50 ]; then
              cat web-frontend.log
              exit 1
            fi
            sleep 0.1
          done
          wait "$server_pid"

      - name: Run the Slint GUI wiring smoke test
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo run -p obs-rs-gui --release -- --smoke

      - name: Run sustained video benchmark fixture
        run: cargo run -p obs-rs-app --bin obs-rs-benchmark --release

      - name: Build API documentation
        run: cargo doc --workspace --no-deps
