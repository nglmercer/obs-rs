name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build the C ABI library
        run: cargo build --workspace --release

      - name: Compile the C ABI smoke test
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I include tests/ffi_smoke.c
          -L target/release -Wl,-rpath,'$ORIGIN'
          -lobs_rs_util -o target/release/ffi_smoke

      - name: Run the C ABI smoke test
        run: ./target/release/ffi_smoke
