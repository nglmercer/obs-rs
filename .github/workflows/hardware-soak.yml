name: Hardware soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Soak duration
        default: "1800"
        required: true
  schedule:
    - cron: "41 1 * * 0"

permissions:
  contents: read

jobs:
  linux-hardware:
    runs-on: [self-hosted, linux, x64, obs-rs-hardware]
    timeout-minutes: 510
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Run capture and A/V soak
        shell: bash
        env:
          OBS_RS_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '28800' || inputs.duration_seconds }}
        run: cargo run -p obs-rs-app --release --bin obs-rs-linux-check | tee soak-results.txt
      - name: Run GPU 1080p60 acceptance fixture
        run: cargo test -p obs-rs-render-wgpu --release --features gpu gpu_1080p60_acceptance_has_no_implicit_readback -- --ignored --nocapture | tee -a soak-results.txt
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-hardware-soak
          path: soak-results.txt

  windows-hardware:
    runs-on: [self-hosted, windows, x64, obs-rs-hardware]
    timeout-minutes: 510
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build and stage the Windows release package
        shell: pwsh
        env:
          OBS_RS_HARDWARE_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '28800' || inputs.duration_seconds }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "obs-rs-windows-hardware-dist"
          .\packaging\windows\package.ps1 -Configuration release -OutputDirectory $dist
          $archive = Get-ChildItem -LiteralPath $dist -Filter "obs-rs-windows-*-x86_64.zip" -File |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw "Windows hardware package was not created"
          }
          $expanded = Join-Path $env:RUNNER_TEMP "obs-rs-windows-hardware-expanded"
          if (Test-Path -LiteralPath $expanded) {
            Remove-Item -LiteralPath $expanded -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $packageRoot = Get-ChildItem -LiteralPath $expanded -Directory -Filter "obs-rs" |
            Select-Object -First 1
          if ($null -eq $packageRoot) {
            throw "expanded Windows hardware package has no obs-rs directory"
          }
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "windows-hardware-artifacts"
          & (Join-Path $packageRoot.FullName "acceptance.ps1") `
            -PackageDirectory $packageRoot.FullName `
            -OutputDirectory $artifacts `
            -SoakSeconds ([int]$env:OBS_RS_HARDWARE_SOAK_SECONDS)
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hardware-soak
          path: windows-hardware-artifacts
          if-no-files-found: warn
