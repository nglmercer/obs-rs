name: Parser fuzzing

on:
  pull_request:
  push:
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - project_config
          - diagnostics
          - obsrpacket
          - frame_packet
          - sandbox_manifests
          - websocket_handshake
          - production_metadata
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run bounded fuzz target
        shell: bash
        run: |
          seconds=30
          if [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=600
          fi
          cargo fuzz run "${{ matrix.target }}" -- -max_total_time="$seconds" -timeout=10
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
