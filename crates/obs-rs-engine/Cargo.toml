[package]
name = "obs-rs-engine"
description = "Portable OBS-RS media session coordinator"
edition.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
production-gstreamer = [
    "dep:obs-rs-output-gstreamer",
    "obs-rs-output-gstreamer/native",
]

[dependencies]
obs-rs-audio = { path = "../obs-rs-audio" }
obs-rs-builtins = { path = "../obs-rs-builtins" }
obs-rs-clock = { path = "../obs-rs-clock" }
obs-rs-config = { path = "../obs-rs-config" }
obs-rs-core = { path = "../obs-rs-core" }
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-output = { path = "../obs-rs-output" }
obs-rs-output-gstreamer = { path = "../obs-rs-output-gstreamer", optional = true }
obs-rs-plugin-api = { path = "../obs-rs-plugin-api" }
obs-rs-project = { path = "../obs-rs-project" }
