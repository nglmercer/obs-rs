[package]
name = "obs-rs-render-wgpu"
description = "Optional wgpu render backend and native-surface capability boundary for OBS-RS"
edition.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
gpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-render = { path = "../obs-rs-render" }
pollster = { version = "0.3", optional = true }
wgpu = { version = "0.20", optional = true }
