[package]
name = "obs-rs-output-gstreamer"
description = "Optional approved GStreamer production output adapter for OBS-RS"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []
native = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
gstreamer = { version = "0.24", features = ["v1_20"], optional = true }
gstreamer-app = { version = "0.24", features = ["v1_20"], optional = true }
obs-rs-audio = { path = "../obs-rs-audio" }
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-output = { path = "../obs-rs-output" }
