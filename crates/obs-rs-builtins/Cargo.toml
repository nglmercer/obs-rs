[package]
name = "obs-rs-builtins"
description = "Portable built-in source plugins for OBS-RS"
edition.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "pnm", "webp"] }
obs-rs-capture = { path = "../obs-rs-capture" }
obs-rs-config = { path = "../obs-rs-config" }
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-plugin-api = { path = "../obs-rs-plugin-api" }
obs-rs-util = { path = "../obs-rs-util" }

[target.'cfg(target_os = "macos")'.dependencies]
obs-rs-capture-macos = { path = "../obs-rs-capture-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
obs-rs-capture-windows = { path = "../obs-rs-capture-windows" }
