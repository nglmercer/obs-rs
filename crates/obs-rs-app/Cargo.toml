[package]
name = "obs-rs-app"
description = "OBS-RS demonstration, terminal frontend, and local browser control surface"
default-run = "obs-rs"
edition.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "obs-rs"
path = "src/main.rs"

[dependencies]
obs-rs-audio = { path = "../obs-rs-audio" }
obs-rs-clock = { path = "../obs-rs-clock" }
obs-rs-builtins = { path = "../obs-rs-builtins" }
obs-rs-capture = { path = "../obs-rs-capture" }
obs-rs-config = { path = "../obs-rs-config" }
obs-rs-core = { path = "../obs-rs-core" }
obs-rs-diagnostics = { path = "../obs-rs-diagnostics" }
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-output = { path = "../obs-rs-output" }
obs-rs-plugin-api = { path = "../obs-rs-plugin-api" }
obs-rs-project = { path = "../obs-rs-project" }
obs-rs-render = { path = "../obs-rs-render" }
obs-rs-ui = { path = "../obs-rs-ui" }
obs-rs-video = { path = "../obs-rs-video" }
