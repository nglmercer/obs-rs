[package]
name = "obs-rs-gui"
description = "Slint desktop control room for OBS-RS"
edition.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = []
production-gstreamer = ["obs-rs-engine/production-gstreamer"]

[dependencies]
i-slint-backend-testing = { version = "=1.17.1", default-features = false, features = [
    "renderer-software",
] }
obs-rs-audio = { path = "../obs-rs-audio" }
obs-rs-audio-pipewire = { path = "../obs-rs-audio-pipewire" }
obs-rs-benchmark = { path = "../obs-rs-benchmark" }
obs-rs-builtins = { path = "../obs-rs-builtins" }
obs-rs-config = { path = "../obs-rs-config" }
obs-rs-capture = { path = "../obs-rs-capture" }
obs-rs-core = { path = "../obs-rs-core" }
obs-rs-diagnostics = { path = "../obs-rs-diagnostics" }
obs-rs-engine = { path = "../obs-rs-engine" }
obs-rs-media = { path = "../obs-rs-media" }
obs-rs-output = { path = "../obs-rs-output" }
obs-rs-plugin-api = { path = "../obs-rs-plugin-api" }
obs-rs-project = { path = "../obs-rs-project" }
obs-rs-render = { path = "../obs-rs-render" }
obs-rs-render-wgpu = { path = "../obs-rs-render-wgpu", features = ["gpu"] }
obs-rs-ui = { path = "../obs-rs-ui" }
obs-rs-util = { path = "../obs-rs-util" }
slint = { version = "1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "std",
] }

[build-dependencies]
embed-resource = "=3.0.11"
slint-build = "=1.17.1"

[target.'cfg(target_os = "windows")'.dependencies]
obs-rs-audio-wasapi = { path = "../obs-rs-audio-wasapi" }
obs-rs-capture-windows = { path = "../obs-rs-capture-windows" }
