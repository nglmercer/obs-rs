[package]
name = "obs-rs-capture-windows-helper"
description = "Native Windows Graphics Capture and Media Foundation helper for OBS-RS"
edition = "2021"
publish = false
version = "0.1.0"

[workspace]

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.dev-fast.package."*"]
debug = 0

[dependencies]
obs-rs-capture = { path = "../../../crates/obs-rs-capture" }
obs-rs-media = { path = "../../../crates/obs-rs-media" }
windows-capture = "2.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.19", features = ["user"] }
