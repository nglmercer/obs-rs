[workspace]
members = [
    "crates/obs-rs-app",
    "crates/obs-rs-audio",
    "crates/obs-rs-audio-wasapi",
    "crates/obs-rs-builtins",
    "crates/obs-rs-capture",
    "crates/obs-rs-capture-macos",
    "crates/obs-rs-capture-windows",
    "crates/obs-rs-clock",
    "crates/obs-rs-config",
    "crates/obs-rs-core",
    "crates/obs-rs-diagnostics",
    "crates/obs-rs-engine",
    "crates/obs-rs-gui",
    "crates/obs-rs-audio-pipewire",
    "crates/obs-rs-benchmark",
    "crates/obs-rs-media",
    "crates/obs-rs-output",
    "crates/obs-rs-output-gstreamer",
    "crates/obs-rs-plugin-api",
    "crates/obs-rs-project",
    "crates/obs-rs-render",
    "crates/obs-rs-render-wgpu",
    "crates/obs-rs-sandbox",
    "crates/obs-rs-ui",
    "crates/obs-rs-update",
    "crates/obs-rs-util",
    "crates/obs-rs-video",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Keep the default development profile quick to compile and small on disk. The
# workspace uses explicit source-level diagnostics for its own crates; full
# debug information in every third-party dependency is rarely useful during
# ordinary GUI iteration and is the main contributor to repeated target growth.
[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0

# Test binaries keep assertions and overflow checks, but do not need complete
# dependency debug information either. This also keeps repeated `cargo test`
# runs from rebuilding or linking unnecessarily large artifacts.
[profile.test]
debug = 1
incremental = true
codegen-units = 16

[profile.test.package."*"]
debug = 0

# Opt-in profile for local preview/GUI work. `opt-level = 1` makes the app and
# workspace crates responsive enough to exercise capture/output behavior while
# retaining incremental compilation and high codegen parallelism.
[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.dev-fast.package."*"]
debug = 0
# Keep third-party and path dependencies at the fastest code-generation level.
# The package being iterated remains at opt-level=1, while rebuilding a large
# dependency graph does not pay the optimization cost on every edit.
opt-level = 0

# Slint's generated test harness is large and the MSVC linker is sensitive to
# very high codegen-unit counts here. Keep the rest of the fast profile highly
# parallel, but use a bounded unit count for the GUI crate so `cargo test`
# remains linkable on Windows.
[profile.dev-fast.package."obs-rs-gui"]
codegen-units = 16

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
panic = "abort"
strip = "symbols"
